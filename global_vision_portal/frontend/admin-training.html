<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Management - Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/portal-theme.css">
    <link rel="stylesheet" href="css/admin-pages.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
</head>
<body class="admin-page">
    <nav class="navbar" aria-hidden="true"></nav>
    <div class="container">
        <header class="admin-hero">
            <div class="admin-hero-inner">
                <h1>Training Management <span class="admin-hero-badge">Admin</span></h1>
                <p>Create courses, manage enrollments, and monitor progress.</p>
            </div>
        </header>
        <div id="trAdminMsg" class="message" style="display:none;"></div>

        <div class="admin-panel">
            <div class="admin-panel-header">
                <h2>Courses</h2>
                <button type="button" class="admin-btn-primary" id="btnAddCourse">+ Add course</button>
            </div>
            <div class="admin-panel-body admin-ann-grid" id="courseAdminList"></div>
        </div>

        <div class="admin-panel">
            <div class="admin-panel-header">
                <h2>Progress monitoring</h2>
                <select id="progressCourseFilter" class="form-control" style="max-width:280px;"><option value="">All courses</option></select>
            </div>
            <div class="admin-panel-body">
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead><tr><th>Employee</th><th>Course</th><th>Status</th><th>Progress</th><th>Certification</th><th></th></tr></thead>
                        <tbody id="progressBody"><tr><td colspan="6">Loading…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="courseModal" class="modal">
        <div class="modal-content admin-modal admin-modal-pro">
            <h2 id="courseModalTitle">Add course</h2>
            <form id="courseForm">
                <input type="hidden" id="courseId">
                <div class="form-group"><label>Title *</label><input type="text" id="courseTitle" class="form-control" required></div>
                <div class="form-group"><label>Description *</label><div id="courseDescriptionEditor" class="ql-editor-container" style="height: 200px;"></div><input type="hidden" id="courseDescription" required></div>
                <div class="signup-grid">
                    <div class="form-group"><label>Trainer</label><input type="text" id="courseTrainer" class="form-control"></div>
                    <div class="form-group"><label>Schedule</label><input type="text" id="courseSchedule" class="form-control" placeholder="e.g. Mon 2–4pm"></div>
                </div>
                <div class="signup-grid">
                    <div class="form-group"><label>Duration</label><input type="text" id="courseDuration" class="form-control"></div>
                    <div class="form-group"><label>Category</label>
                        <select id="courseCategory" class="form-control">
                            <option value="Technical">Technical</option>
                            <option value="Soft Skills">Soft Skills</option>
                            <option value="Compliance">Compliance</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Enrollment limit (optional)</label><input type="number" id="courseLimit" class="form-control" min="1"></div>
                <div class="form-group"><label><input type="checkbox" id="courseActive" checked> Active</label></div>
                <div class="modal-actions">
                    <button type="button" class="admin-btn-ghost" id="btnCancelCourse">Cancel</button>
                    <button type="submit" class="admin-btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer"><p>&copy; 2026 Global Vision Portal.</p></footer>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/screen-access.js"></script>
    <script src="js/app-layout.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/admin-nav.js"></script>
    <script src="js/admin-training.js"></script>
</body>
</html>
