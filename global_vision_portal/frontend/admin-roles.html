    <nav class="navbar" aria-hidden="true"></nav>

        <header class="admin-hero">
            <div class="admin-hero-inner">
                <h1> Roles & Screens <span class="admin-hero-badge">Admin</span></h1>
                <p>Define roles and control which pages each role can access in the portal.</p>
            </div>
        </header>

        <div id="rolesMessage" class="message" style="display:none;"></div>

        <div class="admin-split">
            <aside class="admin-sidebar-card">
                <div class="admin-panel-header">
                    <h2>Roles</h2>
                    <button type="button" class="admin-btn-primary" style="padding:6px 12px;font-size:0.8rem;" id="btnAddRole">+ New</button>
                </div>
                <div class="admin-list-scroll">
                    <ul id="roleList" class="admin-emp-list" style="list-style:none;margin:0;padding:0;">
                        <li class="text-muted" style="padding:12px;">Loading…</li>
                    </ul>
                </div>
            </aside>

            <main class="admin-detail-card" id="roleDetailPanel">
                <div class="admin-empty">
                    <div class="admin-empty-icon"></div>
                    <p>Select a role to manage screen access</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Create role modal -->
    <div id="roleModal" class="modal">
        <div class="modal-content admin-modal admin-modal-pro">
            <h2>Create role</h2>
            <form id="roleForm">
                <div class="form-group">
                    <label for="roleName">Role name *</label>
                    <input type="text" id="roleName" class="form-control" required placeholder="e.g. HR, Supervisor">
                </div>
                <div class="form-group">
                    <label for="roleDesc">Description</label>
                    <input type="text" id="roleDesc" class="form-control" placeholder="Short description">
                </div>
                <div class="modal-actions">
                    <button type="button" class="admin-btn-ghost" id="btnCancelRole">Cancel</button>
                    <button type="submit" class="admin-btn-primary">Create role</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit role modal -->
    <div id="editRoleModal" class="modal">
        <div class="modal-content admin-modal admin-modal-pro">
            <h2>Edit role</h2>
            <input type="hidden" id="editRoleId">
            <form id="editRoleForm">
                <div class="form-group">
                    <label for="editRoleName">Role name *</label>
                    <input type="text" id="editRoleName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="editRoleDesc">Description</label>
                    <input type="text" id="editRoleDesc" class="form-control" placeholder="Short description">
                </div>
                <div class="modal-actions">
                    <button type="button" class="admin-btn-ghost" id="btnCancelEditRole">Cancel</button>
                    <button type="submit" class="admin-btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer"><p>&copy; 2026 Global Vision Portal.</p></footer>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/screen-access.js"></script>
    <script src="js/app-layout.js"></script>
    <script src="js/notifications.js"></script>
