<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestions & Complaints - Global Vision Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/portal-theme.css">
    <link rel="stylesheet" href="css/admin-pages.css">
</head>
<body class="admin-page">
    <nav class="navbar" aria-hidden="true"></nav>
    <div class="container">
        <header class="admin-hero">
            <div class="admin-hero-inner">
                <h1>Suggestions & Complaints</h1>
                <p>Submit feedback. Managers and admins review and respond.</p>
            </div>
        </header>
        <div id="fbMessage" class="message" style="display:none;"></div>

        <div class="admin-panel">
            <div class="admin-panel-header"><h2>Submit new</h2></div>
            <div class="admin-panel-body">
                <form id="fbForm">
                    <div class="signup-grid">
                        <div class="form-group">
                            <label for="fbCategory">Category</label>
                            <select id="fbCategory" class="form-control" required>
                                <option value="Suggestion">Suggestion</option>
                                <option value="Complaint">Complaint</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="fbTitle">Title</label>
                            <input type="text" id="fbTitle" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="fbDescription">Description</label>
                        <textarea id="fbDescription" class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="admin-btn-primary">Submit</button>
                </form>
            </div>
        </div>

        <div class="admin-panel">
            <div class="admin-panel-header"><h2>My submissions &amp; tracking</h2></div>
            <div class="admin-panel-body" id="myFeedbackList"><p class="text-muted">Loading…</p></div>
        </div>

        <div class="admin-panel" id="reviewPanel" style="display:none;">
            <div class="admin-panel-header">
                <h2 id="reviewPanelTitle">All employee feedback</h2>
                <div class="admin-actions-row">
                    <select id="fbStatusFilter" class="form-control" style="max-width:180px;">
                    <option value="">All statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Reviewed">Reviewed</option>
                    <option value="Resolved">Resolved</option>
                </select>
                    <button type="button" class="admin-btn-ghost" id="btnRefreshReview">Refresh</button>
                </div>
            </div>
            <div class="admin-panel-body" id="reviewList"></div>
        </div>
    </div>
    <footer class="footer"><p>&copy; 2026 Global Vision Portal.</p></footer>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/screen-access.js"></script>
    <script src="js/admin-nav.js"></script>
    <script src="js/app-layout.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/feedback.js"></script>
</body>
</html>
