<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration disabled - Global Vision Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/portal-theme.css">
</head>
<body class="login-body">
    <div class="login-container signup-container">
        <div class="login-card signup-card">
            <div class="login-header">
                <img src="images/logo.png" alt="Global Vision" style="height:64px;width:64px;object-fit:contain;margin-bottom:12px;">
                <h1>Account registration</h1>
                <p>Self-registration is not available</p>
            </div>
            <p class="signup-hint" style="text-align:center;margin:24px 0;">
                Portal accounts are created by an administrator.<br>
                Please contact your HR or IT team to request access.
            </p>
            <a href="login.html" class="btn-primary btn-large" style="display:block;text-align:center;text-decoration:none;">Back to login</a>
        </div>
    </div>
</body>
</html>
