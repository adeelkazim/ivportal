<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Late Employees — Global Vision Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/portal-theme.css">
    <style>
        /* ── Page header ── */
        .lt-header {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .lt-header h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin: 0; flex: 1; }

        .lt-controls {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            margin-bottom: 24px;
        }

        /* ── Stat badge ── */
        .lt-stat {
            display: inline-flex; align-items: center; gap: 8px;
            background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
            padding: 10px 20px; margin-bottom: 24px;
        }
        .lt-stat .num { font-size: 28px; font-weight: 900; color: #d97706; line-height: 1; }
        .lt-stat .lbl { font-size: 12px; color: #92400e; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }

        /* ── Table ── */
        .lt-table-wrap { overflow-x: auto; }
        .lt-table {
            width: 100%; border-collapse: collapse; font-size: 13px; min-width: 680px;
        }
        .lt-table th {
            background: #f8fafc; font-size: 10.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .5px; color: #64748b;
            padding: 10px 14px; text-align: left; border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }
        .lt-table td {
            padding: 12px 14px; border-bottom: 1px solid #f1f5f9;
            color: #1e293b; vertical-align: middle;
        }
        .lt-table tr:last-child td { border-bottom: none; }
        .lt-table tr:hover td { background: #fffbeb; }

        /* ── Avatar in table ── */
        .lt-av {
            width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
            font-size: 13px; font-weight: 800; color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            vertical-align: middle; margin-right: 8px;
        }
        .lt-name-cell { display: flex; align-items: center; }
        .lt-name { font-weight: 700; color: #0f172a; }
        .lt-sub  { font-size: 11px; color: #94a3b8; margin-top: 1px; }

        /* ── Time display ── */
        .lt-time {
            font-variant-numeric: tabular-nums;
            font-weight: 700; color: #dc2626;
        }
        .lt-shift { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        .lt-late-by {
            display: inline-block;
            background: #fee2e2; color: #991b1b;
            font-size: 11px; font-weight: 700;
            padding: 2px 7px; border-radius: 12px; margin-top: 3px;
        }

        /* ── Remarks cell ── */
        .lt-remark-preview {
            font-size: 12px; color: #475569; line-height: 1.4;
            max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .lt-remark-meta {
            font-size: 11px; color: #94a3b8; margin-top: 2px;
        }
        .lt-no-remark { font-size: 12px; color: #cbd5e1; }

        /* ── Remark action buttons ── */
        .btn-remark-add {
            font-size: 12px; font-weight: 700;
            color: #2555c4; background: #eff4ff;
            border: 1px solid #bfdbfe; border-radius: 7px;
            padding: 5px 12px; cursor: pointer; white-space: nowrap;
            transition: background .15s;
        }
        .btn-remark-add:hover { background: #dbeafe; }
        .btn-remark-edit {
            font-size: 12px; font-weight: 700;
            color: #475569; background: #f1f5f9;
            border: 1px solid #e2e8f0; border-radius: 7px;
            padding: 5px 12px; cursor: pointer; white-space: nowrap;
            transition: background .15s;
        }
        .btn-remark-edit:hover { background: #e2e8f0; }

        /* ── Modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(15,23,42,.45); z-index: 1000;
            align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .lt-modal {
            background: #fff; border-radius: 16px; width: 100%; max-width: 480px;
            box-shadow: 0 20px 60px rgba(15,23,42,.18);
            overflow: hidden;
        }
        .lt-modal-head {
            padding: 20px 24px 16px;
            border-bottom: 1px solid #e2e8f0;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
        }
        .lt-modal-head h3 { font-size: 16px; font-weight: 800; color: #0f172a; margin: 0 0 3px; }
        .lt-modal-head p  { font-size: 12px; color: #64748b; margin: 0; }
        .lt-modal-body { padding: 20px 24px; }
        .lt-modal-body .form-group { margin-bottom: 16px; }
        .lt-modal-body label {
            display: block; font-size: 12px; font-weight: 700;
            color: #374151; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em;
        }
        .lt-modal-body select,
        .lt-modal-body textarea { width: 100%; }
        .lt-modal-body textarea {
            resize: vertical; min-height: 100px; font-size: 13px;
        }
        .lt-modal-foot {
            padding: 14px 24px 20px;
            display: flex; gap: 10px; justify-content: flex-end;
            border-top: 1px solid #e2e8f0;
        }
        .lt-modal-msg { font-size: 13px; min-height: 20px; margin-bottom: 4px; }
        .lt-modal-msg.error   { color: #dc2626; }
        .lt-modal-msg.success { color: #16a34a; }
    </style>
</head>
<body>
    <div id="portalLayout"></div>
    <div class="portal-page-content">
        <div class="container" style="max-width:1100px;">

            <div class="lt-header">
                <a href="admin-dashboard.html" style="font-size:13px;color:#2555c4;font-weight:600;text-decoration:none;">← Admin Dashboard</a>
                <h1>Late Employees</h1>
            </div>

            <div class="lt-controls">
                <input type="date" id="ltDatePicker" class="form-control" style="max-width:180px;">
                <button type="button" id="ltRefreshBtn" class="btn-primary" style="padding:8px 18px;">↻ Refresh</button>
                <span id="ltDateLabel" style="font-size:13px;color:#64748b;font-weight:600;"></span>
            </div>

            <div class="lt-stat">
                <div class="num" id="ltCount">—</div>
                <div class="lbl">Clocked In Late</div>
            </div>

            <div id="ltMessage" class="message" style="display:none;margin-bottom:14px;"></div>

            <div class="lt-table-wrap">
                <table class="lt-table">
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Team / Client</th>
                            <th>Scheduled</th>
                            <th>Clocked In</th>
                            <th>Remarks</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="ltTableBody">
                        <tr><td colspan="6" style="text-align:center;padding:40px;color:#94a3b8;">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="footer"><p>&copy; 2026 Global Vision Portal. All rights reserved.</p></footer>

    <!-- ── Remarks Modal ── -->
    <div class="modal-overlay" id="ltRemarkModal" role="dialog" aria-modal="true" aria-labelledby="ltModalTitle">
        <div class="lt-modal">
            <div class="lt-modal-head">
                <h3 id="ltModalTitle">Add Remark</h3>
                <p id="ltModalSubtitle"></p>
            </div>
            <div class="lt-modal-body">
                <div class="lt-modal-msg" id="ltModalMsg"></div>

                <div class="form-group">
                    <label for="ltModalTeam">Team</label>
                    <select id="ltModalTeam" class="form-control">
                        <option value="">— Select team (optional) —</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ltModalClient">Client</label>
                    <select id="ltModalClient" class="form-control">
                        <option value="">— Select client (optional) —</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ltModalReason">Reason <span style="color:#dc2626;">*</span></label>
                    <textarea id="ltModalReason" class="form-control" placeholder="Describe the reason for late arrival…"></textarea>
                </div>
            </div>
            <div class="lt-modal-foot">
                <button type="button" id="ltModalCancel" class="admin-btn-ghost" style="padding:8px 18px;">Cancel</button>
                <button type="button" id="ltModalSave"   class="btn-primary"    style="padding:8px 22px;">Save Remark</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/screen-access.js"></script>
    <script src="js/admin-nav.js"></script>
    <script src="js/app-layout.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/admin-late-today.js"></script>
</body>
</html>
